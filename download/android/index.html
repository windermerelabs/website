<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get Jyotica on Google Play — Windermere Labs</title>
<link rel="icon" type="image/png" href="/assets/logo/favicon.png" />
<link rel="canonical" href="https://play.google.com/store/apps/details?id=com.windermerelabs.jyotica&amp;hl=en_IN" />
<meta name="robots" content="noindex, follow" />
<meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.windermerelabs.jyotica&amp;hl=en_IN" />
<style>
  :root {
    --ground: #ffffff;
    --ink: #17121f;
    --ink-soft: #4b4658;
    --ink-faint: #8b8698;
    --accent: #7c3aed;
    --accent-soft: #9d6cf5;
    --celeste: #8b5cf6;
    --shadow: 0 24px 60px rgba(76, 40, 130, 0.09);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    color: var(--ink);
    background: var(--ground);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .bg-blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg-blobs .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
  .blob-1 { width: 520px; height: 520px; top: -160px; right: -130px; background: var(--accent); opacity: 0.16; }
  .blob-2 { width: 440px; height: 440px; bottom: -150px; left: -130px; background: var(--celeste); opacity: 0.15; }

  .card { width: 100%; max-width: 420px; text-align: center; }
  .icon { width: 84px; height: 84px; border-radius: 20px; box-shadow: var(--shadow); }
  .label {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 24px 0 8px;
  }
  h1 { font-size: 1.5rem; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: var(--ink-soft); }
  .btn {
    display: inline-block;
    padding: 13px 26px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    box-shadow: var(--shadow);
  }
  .btn:hover { background: var(--accent-soft); }
  .home { display: block; margin-top: 20px; color: var(--ink-faint); font-size: 0.88rem; text-decoration: none; }
  .home:hover { color: var(--accent); }
</style>

<div class="bg-blobs" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
</div>

<main class="card">
  <img class="icon" src="/assets/images/jyotica-icon.png" alt="Jyotica" />
  <p class="label">Redirecting</p>
  <h1>Taking you to Google Play</h1>
  <p>If nothing happens, tap the button below.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.windermerelabs.jyotica&amp;hl=en_IN" rel="noopener">Get it on Play Store ↗</a>
  <a class="home" href="/product/jyotica/">← Back to Jyotica</a>
</main>

<script>
  location.replace("https://play.google.com/store/apps/details?id=com.windermerelabs.jyotica&hl=en_IN");
</script>
